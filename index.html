<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Dark Maze</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@400;600;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: white;
    }

    /* =========================================
       BACKGROUND
    ========================================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at center,
          rgba(55, 0, 0, 0.25) 0%,
          rgba(15, 0, 0, 0.65) 40%,
          #000 85%
        );
    }

    /* Dark red moon/glow */
    .moon {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;

      left: 50%;
      top: 45%;

      transform: translate(-50%, -50%);

      background:
        radial-gradient(
          circle,
          rgba(130, 0, 0, 0.45),
          rgba(65, 0, 0, 0.15) 45%,
          transparent 72%
        );

      filter: blur(8px);
      animation: moonPulse 5s infinite alternate;
    }

    @keyframes moonPulse {
      from {
        opacity: 0.55;
        transform: translate(-50%, -50%) scale(0.95);
      }

      to {
        opacity: 0.9;
        transform: translate(-50%, -50%) scale(1.08);
      }
    }

    /* =========================================
       FOG
    ========================================= */

    .fog {
      position: absolute;
      width: 200%;
      height: 100%;

      left: -50%;
      top: 10%;

      opacity: 0.12;

      background:
        radial-gradient(
          ellipse,
          rgba(255,255,255,0.3),
          transparent 65%
        );

      filter: blur(50px);

      animation: fogMove 25s linear infinite;
    }

    .fog.two {
      top: 55%;
      opacity: 0.08;
      animation-duration: 35s;
      animation-direction: reverse;
    }

    @keyframes fogMove {
      0% {
        transform: translateX(-10%);
      }

      50% {
        transform: translateX(10%);
      }

      100% {
        transform: translateX(-10%);
      }
    }

    /* =========================================
       MAZE LINES
    ========================================= */

    .maze {
      position: absolute;
      inset: 0;
      opacity: 0.08;

      background-image:
        linear-gradient(90deg, #600 1px, transparent 1px),
        linear-gradient(#600 1px, transparent 1px);

      background-size: 70px 70px;

      transform:
        perspective(500px)
        rotateX(65deg)
        scale(1.8);

      transform-origin: center bottom;

      mask-image: linear-gradient(
        to top,
        black,
        transparent 75%
      );
    }

    /* =========================================
       VIGNETTE
    ========================================= */

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 20%,
          rgba(0,0,0,0.25) 50%,
          rgba(0,0,0,0.95) 100%
        );
    }

    /* =========================================
       SCANLINES
    ========================================= */

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,0.015) 0px,
          rgba(255,255,255,0.015) 1px,
          transparent 2px,
          transparent 4px
        );

      opacity: 0.45;
    }

    /* =========================================
       MAIN CONTENT
    ========================================= */

    .screen {
      position: relative;
      z-index: 10;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 30px;
    }

    .warning {
      font-size: 12px;
      font-weight: 600;

      letter-spacing: 7px;

      color: #8d0000;

      text-transform: uppercase;

      margin-bottom: 18px;

      animation: warningFlicker 4s infinite;
    }

    @keyframes warningFlicker {
      0%, 18%, 20%, 60%, 100% {
        opacity: 1;
      }

      19%,
      59% {
        opacity: 0.2;
      }

      61% {
        opacity: 0.7;
      }
    }

    /* =========================================
       GAME TITLE
    ========================================= */

    .title {
      position: relative;

      font-family: 'Creepster', cursive;

      font-size: clamp(70px, 12vw, 160px);

      letter-spacing: 8px;

      line-height: 0.85;

      color: #e5e5e5;

      text-transform: uppercase;

      text-shadow:
        0 2px 0 #777,
        0 5px 15px #000,
        0 0 15px rgba(150,0,0,0.8),
        0 0 45px rgba(100,0,0,0.5);

      animation: titleFlicker 7s infinite;
    }

    .title span {
      display: block;

      color: #7d0000;

      font-size: 0.62em;

      margin-top: 15px;

      letter-spacing: 16px;

      text-shadow:
        0 0 10px #500000,
        0 0 30px #300000;
    }

    @keyframes titleFlicker {
      0%,
      20%,
      22%,
      63%,
      65%,
      100% {
        opacity: 1;
      }

      21%,
      64% {
        opacity: 0.45;
      }
    }

    /* =========================================
       SUBTITLE
    ========================================= */

    .subtitle {
      margin-top: 35px;

      max-width: 600px;

      font-size: 13px;

      letter-spacing: 4px;

      line-height: 2;

      color: #777;

      text-transform: uppercase;
    }

    .subtitle strong {
      color: #a00000;
    }

    /* =========================================
       PLAY BUTTON
    ========================================= */

    .play-button {
      position: relative;

      display: inline-flex;

      justify-content: center;
      align-items: center;

      margin-top: 45px;

      min-width: 270px;

      padding: 19px 50px;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          #650000,
          #250000
        );

      border: 1px solid #8e0000;

      text-decoration: none;

      font-size: 16px;

      font-weight: 800;

      letter-spacing: 6px;

      text-transform: uppercase;

      box-shadow:
        0 0 20px rgba(100,0,0,0.4),
        inset 0 0 25px rgba(0,0,0,0.5);

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;

      overflow: hidden;
    }

    /* Moving shine */

    .play-button::before {
      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 60%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.15),
          transparent
        );

      transform: skewX(-25deg);

      transition: 0.6s;
    }

    .play-button:hover::before {
      left: 140%;
    }

    .play-button:hover {
      transform: scale(1.07);

      background:
        linear-gradient(
          135deg,
          #a00000,
          #420000
        );

      box-shadow:
        0 0 25px rgba(180,0,0,0.8),
        0 0 60px rgba(100,0,0,0.35),
        inset 0 0 20px rgba(0,0,0,0.3);
    }

    .play-button:active {
      transform: scale(0.97);
    }

    /* =========================================
       BUTTON ARROW
    ========================================= */

    .arrow {
      margin-left: 18px;

      font-size: 18px;

      transition: transform 0.25s ease;
    }

    .play-button:hover .arrow {
      transform: translateX(7px);
    }

    /* =========================================
       BOTTOM UI
    ========================================= */

    .bottom {
      position: absolute;

      bottom: 25px;

      left: 0;

      width: 100%;

      display: flex;

      justify-content: center;

      gap: 35px;

      color: #444;

      font-size: 9px;

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    .bottom span {
      color: #650000;
    }

    /* =========================================
       RANDOM RED FLASH
    ========================================= */

    .flash {
      position: fixed;
      inset: 0;

      z-index: 30;

      pointer-events: none;

      background: rgba(120,0,0,0.08);

      opacity: 0;

      animation: flash 8s infinite;
    }

    @keyframes flash {
      0%, 94%, 100% {
        opacity: 0;
      }

      95% {
        opacity: 0.7;
      }

      96% {
        opacity: 0;
      }

      97% {
        opacity: 0.25;
      }
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      .title {
        font-size: 65px;
        letter-spacing: 3px;
      }

      .title span {
        letter-spacing: 7px;
      }

      .warning {
        letter-spacing: 4px;
        font-size: 9px;
      }

      .subtitle {
        font-size: 10px;
        letter-spacing: 2px;
      }

      .play-button {
        min-width: 220px;
        padding: 17px 30px;
        font-size: 13px;
        letter-spacing: 4px;
      }

      .bottom {
        font-size: 7px;
        gap: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <div class="background">

    <div class="moon"></div>

    <div class="fog"></div>
    <div class="fog two"></div>

    <div class="maze"></div>

  </div>

  <!-- SCREEN EFFECTS -->
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="flash"></div>


  <!-- MAIN MENU -->
  <main class="screen">

    <div class="warning">
      ⚠ Enter at your own risk ⚠
    </div>

    <h1 class="title">
      The Dark
      <span>Maze</span>
    </h1>

    <p class="subtitle">
      There is no map.<br>
      There is <strong>no escape.</strong>
    </p>

    <!--
      THIS BUTTON OPENS YOUR GAME.
      Make sure your game file is named:
      game.html
    -->

    <a href="game.html" class="play-button">
      Play Now
      <span class="arrow">➜</span>
    </a>

    <div class="bottom">
      <div>THE DARK MAZE</div>
      <div><span>•</span></div>
      <div>HEADPHONES RECOMMENDED</div>
    </div>

  </main>

</body>
</html>
